{% extends "base.html" %}
{% block title %}修改密码{% endblock %}
{% block content %}

<div class="page-header">
    <div>
        <h1>修改密码</h1>
        <p class="page-subtitle">此入口会统一跳转到个人资料页处理账号安全设置。</p>
    </div>
</div>

<div class="card password-card">
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
            <label for="old_password">原密码</label>
            <input type="password" name="old_password" id="old_password" class="form-control" required autofocus autocomplete="current-password">
        </div>
        <div class="form-group">
            <label for="new_password">新密码</label>
            <input type="password" name="new_password" id="new_password" class="form-control" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary">修改密码</button>
        <a href="{{ url_for('index') }}" class="btn btn-outline">取消</a>
    </form>
</div>

<style>
.page-subtitle {
    color: var(--text-secondary);
    font-size: 14px;
}
.password-card { max-width: 460px; }
.password-card form {
    display: grid;
    gap: 4px;
}
</style>
{% endblock %}
