{% extends "base.html" %}
{% block title %}登录 - 项目协作平台{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card auth-card-work">
        <div class="auth-brand-mark" aria-hidden="true">PM</div>
        <h1>项目协作平台</h1>
        <p class="subtitle">查看责任事项、项目进展和风险卡点</p>
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" name="username" id="username" class="form-control" required autofocus autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" name="password" id="password" class="form-control" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary">登录</button>
        </form>
        <p class="auth-link">
            还没有账号？<a href="{{ url_for('register') }}">注册</a>
        </p>
    </div>
</div>

<style>
.auth-card-work { max-width: 420px; }
.auth-brand-mark {
    width: 44px;
    height: 44px;
    margin: 0 auto 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    background: var(--primary-soft);
    color: var(--primary-strong);
    font-weight: 800;
    letter-spacing: 0;
}
</style>
{% endblock %}
